<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praktijkopgave</title>
  </head>
  <style type="text/css">
    header {
      width: 100%;
      min-height: 200px;
      position: fixed;
      background-color: blue;
    }

    footer {
      width: 100%;
      min-height: 150px;
      background-color: orange;
    }

    #content {
        display: flex;
        padding-top: 230px;
    }

    #een {
      width: 20%;
      background-color: crimson;
    }

    #twee {
        width: 70%;
        background-color: aquamarine;
    }

    #drie {
        width: 10%;
        background-color: green;
    }

    .doosje {
        width: 250px;
        min-height: 250px;
        background-color: black;
        display: inline-block;
    }
  </style>
  <body>
    <header></header>
    <div id="content">
      <section id="een"></section>
      <section id="twee">
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
          <div class="doosje"></div>
      </section>
      <section id="drie"></section>
    </div>
    <footer></footer>
  </body>
</html>
